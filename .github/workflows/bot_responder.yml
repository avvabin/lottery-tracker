name: Ответ боту на запрос статистики

on:
  schedule:
    - cron: "*/5 * * * *"   # проверка каждые 5 минут
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install pandas requests

      - name: Проверка новых сообщений и ответ
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_responder.py

      - name: Сохранение offset
        run: |
          git config user.name "lottery-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram_offset.json
          git diff --staged --quiet || git commit -m "Обновление offset бота"
          git push
