name: Автосбор и сводка 7 из 42

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Установка зависимостей
        run: pip install selenium pandas webdriver-manager requests

      - name: Сбор новых тиражей + уведомление в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collector.py

      - name: Коммит обновлённого архива (с защитой от гонки)
        run: |
          git config user.name "lottery-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history_backfill.csv latest.csv collector.log fail_count.txt
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
            exit 0
          fi
          git commit -m "Автосбор: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Push успешен (попытка $i)"
              exit 0
            fi
            echo "Push не удался, повтор через паузу (попытка $i)..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Не удалось запушить после 5 попыток"
          exit 1
