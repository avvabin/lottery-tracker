name: Автосбор и сводка 7 из 42

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Установка зависимостей
        run: pip install selenium pandas webdriver-manager requests

      - name: Сбор новых тиражей + уведомление в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collector.py

      - name: Коммит обновлённого архива
        run: |
          git config user.name "lottery-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history_backfill.csv collector.log
          git diff --staged --quiet || git commit -m "Автосбор: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
